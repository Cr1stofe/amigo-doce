name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Install, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: amigo_doce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d amigo_doce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter @amigo-doce/api prisma:generate
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test API against PostgreSQL
        run: pnpm --filter @amigo-doce/api test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://test:test-only@localhost:5432/amigo_doce_test?schema=public
      - name: Build production images
        run: docker compose -f compose.prod.yaml build
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          DATABASE_URL: postgresql://test:test-only@db:5432/test
          ADMIN_USERNAME: test
          ADMIN_PASSWORD: test-only
          TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  deploy:
    name: Deploy to VPS
    needs: ci
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: amigo-doce-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit over native OpenSSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          [[ "$WORK_DIR" == /* ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          key_file="$RUNNER_TEMP/amigo-doce-deploy-key"
          known_hosts_file="$RUNNER_TEMP/amigo-doce-known-hosts"
          umask 077
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"

          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > "$known_hosts_file" 2>/dev/null || true

          printf -v remote_command 'WORK_DIR=%q TARGET_SHA=%q bash -s' "$WORK_DIR" "$TARGET_SHA"
          ssh \
            -i "$key_file" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$WORK_DIR"
          GIT_TERMINAL_PROMPT=0 git fetch origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          docker compose -f compose.prod.yaml up -d --build --remove-orphans --wait --wait-timeout 180
          docker compose -f compose.prod.yaml exec -T web node -e "fetch('http://127.0.0.1:3000/api/auth/me').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
          REMOTE_SCRIPT
      - name: Verify public HTTPS endpoint
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          case "$PUBLIC_URL" in https://*) ;; *) echo 'PUBLIC_URL must start with https://' >&2; exit 1;; esac
          curl --fail --silent --show-error --output /dev/null --max-time 20 "${PUBLIC_URL%/}/"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${PUBLIC_URL%/}/api/auth/me")
          test "$status" = 401
